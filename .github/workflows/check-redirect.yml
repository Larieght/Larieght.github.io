# Builds the site the same way GitHub Pages does and checks the result,
# so a pull request can't break the redirect without you noticing.
# It only checks; it never publishes anything.
name: Check redirect

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build like GitHub Pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Check both pages point at the new site
        run: |
          target=$(sed -n 's/^new_site: *//p' _config.yml)
          echo "Target: $target"
          for f in _site/index.html _site/404.html; do
            echo "--- $f"; cat "$f"
            grep -qF "location.replace(\"$target\"" "$f" || { echo "::error::$f: JavaScript redirect missing"; exit 1; }
            grep -qF "url=$target/" "$f"               || { echo "::error::$f: no-JavaScript redirect missing"; exit 1; }
          done
          test ! -e _site/README.html || { echo "::error::README was published"; exit 1; }

      - name: Keep the built site for inspection
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
